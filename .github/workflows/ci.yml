# Build and test on every platform the app ships for.
#
# The DSP and the device layer have real tests, and the PortAudio build is
# the part most likely to break on a platform nobody sits at — so all three
# operating systems compile the vendored PortAudio and run the Rust suite,
# and Windows does it with ASIO on, which is the build that ships.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Lockfile matches manifest
        run: npm ls --all >/dev/null
      - run: npm run lint
      - run: npm test
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            name: macOS
            features: ''
          - platform: ubuntu-22.04
            name: Linux
            features: ''
          - platform: windows-latest
            name: Windows (ASIO)
            features: '--features asio'
    runs-on: ${{ matrix.platform }}
    name: rust — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The Tauri crate embeds the frontend at compile time; the workspace
      # crates do not need it, but `cargo test --workspace` builds them all.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test
        working-directory: src-tauri
        run: cargo test --workspace ${{ matrix.features }}
      # PortAudio initialises without any audio hardware on every runner, so
      # the enumeration test above already proved the library links. This
      # prints what the runner had, for the log.
      - name: List what the runner sees
        working-directory: src-tauri
        run: cargo run -p soundbench-audio --example bench ${{ matrix.features }} -- list
